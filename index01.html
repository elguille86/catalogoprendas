<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Catálogo de Polos</title>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>
    <header class="header">
        <h1>✨ Nuevos Productos</h1>
    </header>

    <section class="catalogo" id="catalogo">
        <!-- Los productos se generarán automáticamente -->
    </section>

    <script>
        async function cargarProductos() {
            try {
                const respuesta = await fetch("productos.json");
                const productos = await respuesta.json();

                const contenedor = document.getElementById("catalogo");

                productos.forEach(p => {

                    const estrellas = "★".repeat(p.rating) + "☆".repeat(5 - p.rating);

                    const div = document.createElement("div");
                    div.classList.add("producto");

                    div.innerHTML = `
                        <span class="label ${p.label === 'HOT' ? 'hot' : 'best'}">${p.label}</span>
                        <img src="${p.imagen}" alt="${p.nombre}">
                        <h3>${p.nombre}</h3>
                        <p class="precio">
                            <span>S/ ${p.precio.toFixed(2)}</span>
                            <del>S/ ${p.precio_anterior.toFixed(2)}</del>
                        </p>
                        <div class="estrellas">${estrellas}</div>
                    `;

                    contenedor.appendChild(div);
                });

            } catch (error) {
                console.error("Error cargando productos:", error);
            }
        }

        cargarProductos();
    </script>

</body>
</html>
