<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Polos</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <header class="header">
        <h1 class="section-title">✨ NUEVOS PRODUCTOS</h1>
    </header>

    <section class="catalogo" id="catalogo"></section>

    <script>
        const CLASES_LABEL = {
            "Más vendido": "label-venta",
            "Destacado": "label-hot",
            "Nuevo": "label-nuevo",
            "Oferta": "label-oferta",
            "Descuento": "label-descuento"
        };

        async function cargarProductos() {
            try {
                const res = await fetch("productos.json");
                const productos = await res.json();
                const cont = document.getElementById("catalogo");

                productos.forEach(p => {
                    const card = document.createElement("div");
                    card.classList.add("product-card");

                    const estrellas = "★".repeat(p.rating) + "☆".repeat(5 - p.rating);
                    const labelClass = CLASES_LABEL[p.label] || "";

                    card.innerHTML = `
                        <div class="product-label ${labelClass}">
                            ${p.label !== "" ? p.label.toUpperCase() : ""}
                        </div>

                        <img src="${p.imagen}" alt="${p.nombre}">
                        
                        <h3 class="product-name">${p.nombre}</h3>

                        <p class="price">
                            S/ ${p.precio.toFixed(2)}
                            <span class="old-price">S/ ${p.precio_anterior.toFixed(2)}</span>
                        </p>

                        <div class="stars">${estrellas}</div>
                    `;

                    cont.appendChild(card);
                });

            } catch (e) {
                console.error("Error cargando productos:", e);
            }
        }

        cargarProductos();
    </script>

</body>
</html>
